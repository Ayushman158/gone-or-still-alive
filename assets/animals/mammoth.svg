<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMammoth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D5B4C"/>
      <stop offset="100%" stop-color="#5D3A29"/>
    </linearGradient>
    <linearGradient id="tuskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#FFE57F"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="30" fill="url(#bgMammoth)"/>
  <!-- Decorative snowflakes/ice symbols -->
  <circle cx="60" cy="50" r="18" fill="#E1F5FE" opacity="0.8"/>
  <circle cx="340" cy="70" r="24" fill="#E1F5FE" opacity="0.8"/>
  <text x="54" y="56" font-family="sans-serif" font-size="18" fill="#4FC3F7">❄</text>
  <text x="332" y="78" font-family="sans-serif" font-size="24" fill="#4FC3F7">❄</text>

  <!-- Mammoth Body -->
  <!-- Back legs -->
  <rect x="130" y="190" width="34" height="85" rx="17" fill="#4E342E"/>
  <rect x="250" y="190" width="34" height="85" rx="17" fill="#4E342E"/>
  <!-- Main Body Hump & Shaggy Fur -->
  <path d="M110 200 C90 160 100 110 150 100 C190 90 230 115 260 135 C290 155 300 200 280 230 C250 250 140 250 110 200 Z" fill="url(#furGrad)"/>
  <!-- Fur fringe fringe -->
  <path d="M120 220 Q140 250 160 225 Q180 255 200 225 Q220 255 240 225 Q260 250 280 220" fill="none" stroke="#4E342E" stroke-width="8" stroke-linecap="round"/>
  <!-- Front legs -->
  <rect x="155" y="195" width="38" height="90" rx="18" fill="#6D4C41"/>
  <rect x="225" y="195" width="38" height="90" rx="18" fill="#6D4C41"/>
  <!-- Big Head -->
  <circle cx="120" cy="140" r="55" fill="url(#furGrad)"/>
  <!-- High Dome Top Fur -->
  <path d="M85 120 C85 85 145 85 150 120 Z" fill="#5D3A29"/>
  <!-- Ear -->
  <ellipse cx="145" cy="135" rx="14" ry="20" fill="#4E342E" transform="rotate(-15 145 135)"/>
  <!-- Friendly Eye -->
  <circle cx="105" cy="125" r="7" fill="#212121"/>
  <circle cx="103" cy="123" r="2.5" fill="#FFFFFF"/>
  <!-- Long Trunk -->
  <path d="M90 150 C70 170 65 210 80 235 C88 248 105 240 98 225 C88 205 92 180 105 165" fill="none" stroke="#6D4C41" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Giant Curved Tusks -->
  <path d="M100 165 C60 175 30 220 50 250 C65 268 95 245 78 228 C65 215 75 190 105 178" fill="url(#tuskGrad)" stroke="#FFE082" stroke-width="2"/>
  <path d="M115 165 C85 185 60 225 80 250 C92 265 115 245 102 232 C92 220 100 200 120 180" fill="url(#tuskGrad)" stroke="#FFE082" stroke-width="2" opacity="0.9"/>
  <!-- Little Tail -->
  <path d="M290 185 Q310 195 305 215" fill="none" stroke="#5D3A29" stroke-width="6" stroke-linecap="round"/>
</svg>
