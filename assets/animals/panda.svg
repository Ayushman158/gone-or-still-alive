<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPanda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F8F5"/>
      <stop offset="100%" stop-color="#D1F2EB"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="30" fill="url(#bgPanda)"/>
  <!-- Bamboo stalks in background -->
  <rect x="40" y="30" width="12" height="260" rx="4" fill="#82E0AA"/>
  <line x1="38" y1="90" x2="54" y2="90" stroke="#52BE80" stroke-width="4"/>
  <line x1="38" y1="160" x2="54" y2="160" stroke="#52BE80" stroke-width="4"/>
  <line x1="38" y1="230" x2="54" y2="230" stroke="#52BE80" stroke-width="4"/>
  <path d="M52 90 Q75 80 85 95 Q65 100 52 95 Z" fill="#52BE80"/>

  <!-- Back Black Legs -->
  <ellipse cx="270" cy="220" rx="32" ry="40" fill="#212121" transform="rotate(-15 270 220)"/>

  <!-- White Body -->
  <ellipse cx="205" cy="180" rx="85" ry="65" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>

  <!-- Black Shoulder Band -->
  <path d="M140 145 C170 135 220 135 245 150 C230 195 160 195 140 145 Z" fill="#212121"/>

  <!-- Front Black Legs -->
  <ellipse cx="150" cy="220" rx="24" ry="42" fill="#212121" transform="rotate(10 150 220)"/>
  <ellipse cx="195" cy="225" rx="22" ry="38" fill="#212121"/>

  <!-- Big Round White Head -->
  <circle cx="115" cy="130" r="50" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="2"/>

  <!-- Black Fuzzy Round Ears -->
  <circle cx="75" cy="85" r="18" fill="#212121"/>
  <circle cx="155" cy="85" r="18" fill="#212121"/>

  <!-- Distinctive Panda Black Eye Patches (tilted ovals) -->
  <ellipse cx="95" cy="125" rx="14" ry="18" fill="#212121" transform="rotate(-20 95 125)"/>
  <ellipse cx="135" cy="125" rx="14" ry="18" fill="#212121" transform="rotate(20 135 125)"/>

  <!-- Bright Friendly Eyes inside patches -->
  <circle cx="97" cy="123" r="5" fill="#FFFFFF"/>
  <circle cx="97" cy="123" r="3" fill="#000000"/>
  <circle cx="96" cy="121" r="1.2" fill="#FFFFFF"/>

  <circle cx="133" cy="123" r="5" fill="#FFFFFF"/>
  <circle cx="133" cy="123" r="3" fill="#000000"/>
  <circle cx="132" cy="121" r="1.2" fill="#FFFFFF"/>

  <!-- Black Cute Nose & Smile -->
  <ellipse cx="115" cy="145" rx="9" ry="6" fill="#212121"/>
  <path d="M110 155 Q115 160 120 155" fill="none" stroke="#212121" stroke-width="3" stroke-linecap="round"/>

  <!-- Bamboo Leaf Snack in Paws -->
  <path d="M130 190 Q150 170 175 180 Q150 195 130 190 Z" fill="#27AE60"/>
  <line x1="125" y1="195" x2="165" y2="182" stroke="#1E8449" stroke-width="3" stroke-linecap="round"/>
</svg>
