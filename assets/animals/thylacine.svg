<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgThylacine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFEBE9"/>
      <stop offset="100%" stop-color="#D7CCC8"/>
    </linearGradient>
    <linearGradient id="thylaCoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="100%" stop-color="#A1887F"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="30" fill="url(#bgThylacine)"/>
  <!-- Australian fern / eucalyptus leaf silhouette -->
  <path d="M40 50 C60 20 80 40 85 80 C60 80 45 65 40 50 Z" fill="#A5D6A7" opacity="0.6"/>
  <path d="M330 40 C350 20 375 40 370 70 C345 75 335 60 330 40 Z" fill="#A5D6A7" opacity="0.6"/>

  <!-- Back Legs -->
  <rect x="235" y="175" width="24" height="95" rx="12" fill="#6D4C41"/>
  <rect x="270" y="180" width="22" height="90" rx="11" fill="#5D4037"/>

  <!-- Body -->
  <ellipse cx="200" cy="180" rx="85" ry="50" fill="url(#thylaCoat)"/>

  <!-- Distinctive Thylacine Dark Stripes on Lower Back & Rump -->
  <path d="M190 145 L192 185 M205 140 L208 190 M220 138 L224 195 M235 140 L239 195 M250 145 L254 190 M265 152 L268 185 M278 160 L280 180" stroke="#3E2723" stroke-width="5" stroke-linecap="round"/>

  <!-- Front Legs -->
  <rect x="135" y="175" width="24" height="95" rx="12" fill="#8D6E63"/>
  <rect x="165" y="180" width="22" height="90" rx="11" fill="#A1887F"/>

  <!-- Rigid, Kangaroo-like Tail Base (distinctive thylacine feature) -->
  <path d="M280 170 C320 175 350 210 360 230 C355 235 345 230 335 215 C320 195 295 185 275 180" fill="#8D6E63"/>

  <!-- Head & Snout (dog-like marsupial head) -->
  <ellipse cx="110" cy="140" rx="42" ry="32" fill="url(#thylaCoat)"/>
  <path d="M95 130 L55 145 C50 150 55 158 65 158 L95 155 Z" fill="#BCAAA4"/>
  <ellipse cx="55" cy="148" rx="6" ry="5" fill="#3E2723"/>

  <!-- Rounded Erect Ears -->
  <polygon points="105,100 120,120 95,118" fill="#8D6E63"/>
  <polygon points="108,105 118,118 100,117" fill="#FFCDD2"/>
  <polygon points="125,102 140,122 118,120" fill="#8D6E63"/>

  <!-- Dark Marsupial Eye -->
  <circle cx="95" cy="135" r="6" fill="#3E2723"/>
  <circle cx="93" cy="133" r="2" fill="#FFFFFF"/>
</svg>
