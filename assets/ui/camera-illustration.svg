<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="100%" height="100%">
  <defs>
    <linearGradient id="camBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70B4F9"/>
      <stop offset="100%" stop-color="#4D96FF"/>
    </linearGradient>
    <linearGradient id="camTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8DC4FF"/>
      <stop offset="100%" stop-color="#70B4F9"/>
    </linearGradient>
  </defs>

  <!-- Top Shutter Button & Flash -->
  <rect x="35" y="25" width="30" height="15" rx="6" fill="#3B82F6"/>
  <rect x="70" y="18" width="60" height="24" rx="8" fill="url(#camTop)"/>
  <circle cx="145" cy="30" r="8" fill="#FFD166"/>

  <!-- Main Camera Body -->
  <rect x="20" y="36" width="160" height="120" rx="28" fill="url(#camBody)"/>

  <!-- Outer Lens Ring -->
  <circle cx="100" cy="98" r="44" fill="#FFFFFF"/>
  <circle cx="100" cy="98" r="36" fill="#1E293B"/>

  <!-- Inner Gloss Lens -->
  <circle cx="100" cy="98" r="26" fill="#0F172A"/>
  <!-- Lens reflection highlight -->
  <ellipse cx="90" cy="88" rx="8" ry="12" fill="#FFFFFF" opacity="0.6" transform="rotate(-30 90 88)"/>
  <circle cx="112" cy="110" r="4" fill="#FFFFFF" opacity="0.5"/>

  <!-- Cute Camera Cheeks -->
  <circle cx="48" cy="115" r="7" fill="#FFAAA6" opacity="0.8"/>
  <circle cx="152" cy="115" r="7" fill="#FFAAA6" opacity="0.8"/>

  <!-- Flash/Sensor Dot -->
  <circle cx="45" cy="60" r="6" fill="#FFD166"/>
</svg>
